<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>xlamBOT — разметка газа</title>
<link rel="stylesheet" href="/static/gas.css">
</head>
<body>
<header class="bar">
  <div class="bar-left">
    <h1>Разметка газа</h1>
    <span class="dev" id="devName"></span>
  </div>
  <div class="bar-right">
    <div class="count" id="frameCount"></div>
    <button class="btn" id="prevBtn" title="Предыдущий кадр (стрелка влево)">&larr;</button>
    <span class="pos" id="posLabel"></span>
    <button class="btn" id="nextBtn" title="Следующий кадр (Enter)">&rarr;</button>
    <span class="sep"></span>
    <label class="chk"><input type="checkbox" id="shortlistChk" checked> только с газом</label>
    <span class="sep"></span>
    <button class="btn" id="clearBtn" title="Стереть разметку кадра (Delete)">Стереть</button>
    <button class="btn btn-primary" id="saveBtn" title="Сохранить (Ctrl+S)">Сохранить</button>
    <button class="btn btn-fit" id="fitBtn" title="Посчитать цвет и применить">Подобрать цвет</button>
  </div>
</header>

<main class="main">
  <div class="stage">
    <div class="canvas-wrap" id="canvasWrap">
      <img id="frameImg" alt="кадр боя">
      <canvas id="draw"></canvas>
    </div>
    <p class="hint">
      Тяните мышью по газу — рисуется область. Клик по уже размеченной области — убрать её.
      <code>Shift</code> + тянуть — стереть. <code>Enter</code> — следующий кадр,
      <code>&larr;</code> — назад, <code>Ctrl+S</code> — сохранить, <code>Delete</code> — очистить кадр.
    </p>
  </div>

  <aside class="side">
    <div class="panel">
      <div class="panel-title">Кадры</div>
      <div class="thumbs" id="thumbs"></div>
    </div>
    <div class="panel">
      <div class="panel-title">Результат подбора</div>
      <div class="fit-out" id="fitOut">Нажмите &laquo;Подобрать цвет&raquo;, когда разметите хотя бы один кадр.</div>
    </div>
  </aside>
</main>

<div id="toast" class="toast hidden"></div>
<script src="/static/gas.js"></script>
</body>
</html>
